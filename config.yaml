--- !Config
lang: zh
save_to_file: ""
# 当vocadb有重名歌曲，且程序默认选择错误的曲目时启用此项
vocadb_manual: false
# 当vocadb搜索不到歌曲条目时，允许手动输入歌曲条目链接
vocadb_manual_url: false
# 自定义输出文件夹，如果留空则让程序自行选择默认文件夹
# （理论上）支持任意操作系统的任意路径，例如"~/Documents/萌百"或"D:\萌百"或"output2"
output_dir: ""
# 自定义代理的ip地址，格式是http://127.0.0.1:<端口号>
# 如果不使用代理请留空
proxies: "http://127.0.0.1:7897"
wikitext: !WikitextConfig
  # 对日语歌词额外处理（去除多余的换行）
  process_lyrics_jap: true
  # 检测歌词中的括号，如果括号中都是平假名而且括号前有汉字，将括号中内容
  # 视为注音并添加photrans模板。
  furigana_local: true
  # 从Yahoo，vocadb，Vocaloid Lyrics Wiki等网站获取振假名；暂时没有效果
  furigana_all: false
  # 所有歌词留空，并默认填写AtWiki为翻译源（定制选项，慎用）
  no_lyrics: false
  # 是否在日文和中文歌词的空行中插入#NoHover
  no_hover: true
  # 人间百态版VOCALOID Songbox Introduction配色优化方案
  optimize_Introduction_color: true
  # 检测不到AtWiki的中文翻译后直接放弃，减少使用难度
  lyrics_chs_fail_fast: false
  # 是否询问投稿文
  uploader_note: true
  # 是否检测P主模板
  producer_template: true
color: !ColorConfig
  # 启用可视化颜色编辑器（弹出窗口修改颜色栏参数）
  # 开启后会自动载入封面，可直接用吸管在封面上取色；
  # 编辑器内的「自动文字色」会依据背景亮度（阈值可调，默认 60）自动选择黑/白文字；
  # 同时管理 VOCALOID_Songbox 三行颜色、VOCALOID Songbox Introduction 的
  # lbgcolor/ltcolor/rbdcolor，以及 LyricsKai 的 lstyle/rstyle/containerstyle。
  # 后两处填入的是完整 CSS 声明（背景/边框/圆角/阴影/文字样式等），
  # 歌词三项可用「输出」开关控制是否写入代码（关闭则整行删去）。
  # 编辑器里的「AI 参考封面生成 CSS」按钮（需在 wiki_credentials.yaml 里填 ai_api_key）
  # 关掉后整个 AI 面板不显示，便于完全断网使用；只在点击按钮时才会联网调用。
  ai_css: true
  color_editor: false
image: !ImageConfig
  # 下载封面（自动选择分辨率最大的一张：niconico 的 OGP 大图优先级最高，
  # 其余站点只读取图片头部识别分辨率，不下载整张图片来比较）
  download_cover: false
  # 自动裁剪封面黑边（自动识别黑边长度，无需手动设置裁剪力度）
  crop: true
wiki: !WikiConfig
  # Vocawiki 的 API 地址
  api_url: "https://voca.wiki/api.php"
  # 生成 wikitext 后弹出提交窗口：可在窗口内实时预览（调用 Vocawiki API 渲染）、
  # 修改 wikitext 并直接提交到 Vocawiki，而不是用 VS Code 打开输出文件。
  # 若已下载封面（image.download_cover），提交条目时会一并上传该封面，
  # 这也是本工具唯一的上传图片入口（需要 wiki_credentials.yaml 中的账号/机器人密码）
  submit_window: false
  # 提交时若歌曲存在日文原名，额外创建「日文原名 → 中文条目」的重定向页面
  create_redirect: false