--- !Config
lang: zh
save_to_file: ""
# 当vocadb有重名歌曲，且程序默认选择错误的曲目时启用此项
vocadb_manual: false
# 当vocadb搜索不到歌曲条目时，允许手动输入歌曲条目链接
vocadb_manual_url: false
# 自定义输出文件夹，如果留空则让程序自行选择默认文件夹
# （理论上）支持任意操作系统的任意路径，例如"~/Documents/萌百"或"D:\萌百"或"output2"
output_dir: ""
# 自定义代理的ip地址，格式是http://127.0.0.1:<端口号>
# 如果不使用代理请留空
proxies: "http://127.0.0.1:7897"
wikitext: !WikitextConfig
  # 检测歌词中的括号，如果括号中都是平假名而且括号前有汉字，将括号中内容
  # 视为注音并添加photrans模板。
  furigana_local: true
  # 从Yahoo，vocadb，Vocaloid Lyrics Wiki等网站获取振假名；暂时没有效果
  furigana_all: false
  # 人间百态版VOCALOID Songbox Introduction配色优化方案
  optimize_Introduction_color: true
  # AtWiki 等站点找不到中文翻译时如何处理：
  # false = 先询问「是否手动输入」（选「是」会弹出歌词整理窗口）；
  # true  = 直接放弃，既不询问也不会弹出歌词整理窗口。
  lyrics_chs_fail_fast: false
  # 是否询问投稿文
  uploader_note: true
  # 是否检测P主模板：先查 voca.wiki 的 Category:P主模板（含模板重定向）建成的字典，
  # 命中就直接用 {{P主模板}}；字典里没有的才逐个调 API 搜索（整轮只联网取一次字典）。
  producer_template: true
  # 歌词整理窗口里的「AI 识别并填入」按钮：把混在一起的歌词交给大模型分成
  # 日语 / 中文 / 罗马音三栏（密钥见 wiki_credentials.yaml 的 ai_api_key）。
  # 设为 false 时界面不显示该按钮，也不会有任何联网调用；
  # 纯规则的「自动识别并填入」不受影响，照常可用。
  ai_lyrics: true
  # 生成「== 注释 ==」时用 API 读模板源码，判断导航框的 |state 默认是展开还是折叠：
  # 默认展开的（如 Template:可不/2024）自动补上 |collapsed，默认已折叠的（如 Template:重音Teto/2024）不动；
  # 取不到源码 / 认不出状态时保持原样，不影响生成
  collapse_navbox: true
  # 询问「是否存在人声本家」（同一首歌的人声演唱版本）：
  # 回答「是」后会要求给出它的 niconico 链接（或 YouTube 链接）与 bilibili 链接（都可以留空跳过）；
  # 简介里追加一句「另有P主本人演唱的人声本家。」
  # （若演唱者不是P主本人，可在提交窗口里改这一句），
  # 「== 歌曲 ==」小节里按版本分块：「;VOCALOID本家」+ 该版本视频，
  # 「;人声本家」+ 人声本家的 niconico/YouTube（{{sm}} 或 {{YoutubeVideo}}）与 {{BilibiliVideo}}。
  # 参 voca.wiki 条目：如月车站、红色房间。
  human_original: false
color: !ColorConfig
  # 启用可视化颜色编辑器（弹出窗口修改颜色栏参数）
  # 开启后会自动载入封面，可直接用吸管在封面上取色；
  # 编辑器内的「自动文字色」会依据背景亮度（阈值可调，默认 60）自动选择黑/白文字；
  # 同时管理 VOCALOID_Songbox 三行颜色、VOCALOID Songbox Introduction 的
  # lbgcolor/ltcolor/rbdcolor，以及 LyricsKai 的 lstyle/rstyle/containerstyle。
  # 后两处填入的是完整 CSS 声明（背景/边框/圆角/阴影/文字样式等），
  # 歌词三项可用「输出」开关控制是否写入代码（关闭则整行删去）。
  # 编辑器里的「AI 参考封面生成 CSS」按钮（需在 wiki_credentials.yaml 里填 ai_api_key）
  # 关掉后整个 AI 面板不显示，便于完全断网使用；只在点击按钮时才会联网调用。
  ai_css: true
  # AI 生成 CSS 时预填到「补充要求」里的默认提示词，按编辑器 Tab 分三栏
  # （Songbox / Introduction / 歌词）；留空则不预填，界面上仍可随时改写。
  # 例：ai_prompt_lyrics: "文字用封面主色，容器加圆角与淡淡的阴影"
  ai_prompt_songbox: ""
  ai_prompt_intro: ""
  ai_prompt_lyrics: ""
  color_editor: false
image: !ImageConfig
  # 下载封面（自动选择分辨率最大的一张：niconico 的 OGP 大图优先级最高，
  # 其余站点只读取图片头部识别分辨率，不下载整张图片来比较）
  download_cover: false
  # 自动裁剪封面黑边（自动识别黑边长度，无需手动设置裁剪力度）
  crop: true
wiki: !WikiConfig
  # Vocawiki 的 API 地址
  api_url: "https://voca.wiki/api.php"
  # 生成 wikitext 后弹出提交窗口：可在窗口内实时预览（调用 Vocawiki API 渲染）、
  # 修改 wikitext 并直接提交到 Vocawiki，而不是用 VS Code 打开输出文件。
  # 若已下载封面（image.download_cover），提交条目时会一并上传该封面，
  # 这也是本工具唯一的上传图片入口（需要 wiki_credentials.yaml 中的账号/机器人密码）
  submit_window: false
  # 提交时若歌曲存在日文原名，额外创建「日文原名 → 中文条目」的重定向页面
  create_redirect: false
  # 同名条目（消歧义）处理：译名在 Vocawiki 上已有同名条目时，
  # 条目名与封面文件名改用「歌名(P主名)」（日文 P主名取 vocadb 的罗马音），
  # 条目顶部自动加 {{About}}（共 2 个同名）或 {{Otheruseslist}}（3 个以上），
  # 提交时还会按情况修订 / 创建消歧义页，并列出名链接入页面让你确认替换。
  # 设为 false 则完全不检查同名条目（一律用译名当条目名）。
  disambiguate: true