--- !Config
save_to_file: ""
# 选择程序语言。zh为中文，en是英文。注意：部分内容没有被汉化。
lang: "zh"
# 当vocadb有重名歌曲，且程序默认选择错误的曲目时启用此项
vocadb_manual: false
# 当vocadb搜索不到歌曲条目时，允许手动输入歌曲条目链接
vocadb_manual_url: false
# 自定义输出文件夹，如果留空则让程序自行选择默认文件夹
# （理论上）支持任意操作系统的任意路径，例如"~/Documents/萌百"或"D:\萌百"或"output2"
output_dir: ""
# 自定义代理的ip地址，格式是http://127.0.0.1:<端口号>
# 如果不使用代理请留空
proxies: ""
wikitext: !WikitextConfig
  # 对日语歌词额外处理（去除多余的换行）
  process_lyrics_jap: true
  # 检测歌词中的括号，如果括号中都是平假名而且括号前有汉字，将括号中内容
  # 视为注音并添加photrans模板。
  furigana_local: true
  # 从Yahoo，vocadb，Vocaloid Lyrics Wiki等网站获取振假名；暂时没有效果
  furigana_all: false
  # 所有歌词留空，并默认填写AtWiki为翻译源（定制选项，慎用）
  no_lyrics: false
  # 检测不到AtWiki的中文翻译后直接放弃，减少使用难度
  lyrics_chs_fail_fast: true
  # 是否询问投稿文
  uploader_note: false
  # 是否检测P主模板：先查 voca.wiki 的 Category:P主模板（含重定向）字典，没命中才逐个搜索
  producer_template: false
  # 生成「== 注释 ==」时用 API 读模板源码，判断导航框的 |state 默认是展开还是折叠：
  # 默认展开的自动补上 |collapsed，默认已折叠的不动；取不到源码时保持原样
  collapse_navbox: true
color: !ColorConfig
  # 启用可视化颜色编辑器（弹出窗口修改颜色栏参数）
  # 开启后会自动载入封面，可直接用吸管在封面上取色；
  # 同时管理 Songbox 三行颜色、Introduction（lbgcolor/ltcolor/rbdcolor）
  # 与 LyricsKai 歌词模板（lstyle/rstyle/containerstyle）的样式
  # 编辑器里的「AI 参考封面生成 CSS」按钮（需在 wiki_credentials.yaml 里填 ai_api_key）
  # 关掉后整个 AI 面板不显示，便于完全断网使用；只在点击按钮时才会联网调用。
  ai_css: true
  # AI 生成 CSS 时预填到「补充要求」里的默认提示词，按编辑器 Tab 分三栏
  # （Songbox / Introduction / 歌词）；留空则不预填，界面上仍可随时改写。
  ai_prompt_songbox: ""
  ai_prompt_intro: ""
  ai_prompt_lyrics: ""
  color_editor: false
image: !ImageConfig
  # 下载封面（自动选择分辨率最大的一张：niconico 的 OGP 大图优先级最高）
  download_cover: false
  # 自动裁剪封面黑边（自动识别黑边长度，无需手动设置裁剪力度）
  crop: true
wiki: !WikiConfig
  # Vocawiki 的 API 地址
  api_url: "https://voca.wiki/api.php"
  # 生成 wikitext 后弹出提交窗口（实时预览 / 编辑 / 提交），
  # 已下载的封面会在提交条目时一并上传
  submit_window: false
  # 提交时若歌曲存在日文原名，额外创建重定向页面
  create_redirect: false
