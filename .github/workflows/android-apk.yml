name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - "build_android.sh"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "APK version"
        required: false
        default: "0.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential ccache cmake git libffi-dev \
            libncurses5-dev libncursesw5-dev libssl-dev libtool openjdk-17-jdk \
            pkg-config unzip zip zlib1g-dev
          sudo apt-get install -y --no-install-recommends libtinfo5 || true

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Cache Buildozer toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            mobile/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec.in') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build debug APK
        run: |
          chmod +x build_android.sh
          VERSION="${{ github.event.inputs.version || '0.0.0' }}"
          ./build_android.sh "$VERSION" debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vocawiki-apk
          path: "Vocawiki-create-tool (*).apk"
          if-no-files-found: error
