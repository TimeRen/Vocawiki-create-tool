name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      # 应用代码全都要算上：改了 utils/ 里的业务逻辑，APK 也得重编。
      - "mobile/**"
      - "utils/**"
      - "models/**"
      - "config/**"
      - "i18n/**"
      - "main.py"
      - "build.py"
      - "build_android.sh"
      - "compile_mo.py"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "APK version"
        required: false
        default: ""

permissions:
  contents: write        # 发布 release：设置页「检查更新」读的就是它

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Work out the version
        id: version
        # 版本号单调递增：`1.<工作流序号>`（手动触发时可以自己指定）
        run: |
          VERSION="${{ github.event.inputs.version || '' }}"
          if [ -z "$VERSION" ]; then VERSION="1.${{ github.run_number }}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "这次构建的版本号：$VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential ccache cmake git libffi-dev \
            libncurses5-dev libncursesw5-dev libssl-dev libtool openjdk-17-jdk \
            pkg-config unzip zip zlib1g-dev
          sudo apt-get install -y --no-install-recommends libtinfo5 || true

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Cache Buildozer toolchain
        uses: actions/cache@v4
        with:
          # 不要缓存 mobile/.buildozer：里面有指向旧 Python/venv 的路径，
          # 换 runner 后恢复会破坏 p4a 的 pip 环境。SDK/NDK 缓存就够了。
          path: ~/.buildozer
          # 换 key 前缀，避免沿用早先含 mobile/.buildozer 的旧缓存。
          key: p4a-sdk-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec.in') }}
          restore-keys: |
            p4a-sdk-${{ runner.os }}-

      - name: Syntax check the sources
        run: |
          # p4a v2024.01.21 ships CPython 3.11; catch syntax that only newer
          # interpreters accept before spending 10 minutes in the NDK.
          python -m compileall -q mobile main.py config models utils i18n

      - name: Build debug APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          chmod +x build_android.sh
          ./build_android.sh "${{ steps.version.outputs.version }}" debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vocawiki-apk
          path: "Vocawiki-create-tool (*).apk"
          if-no-files-found: error

      - name: Publish the update release
        # 设置页「检查更新」读的就是这个 release（`/releases/latest` → 里头的 apk / zip）。
        # 每次推送都发一个新 tag（`build-<序号>`）；下面 exe 那个作业往同一个 tag 补 zip。
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 构建 ${{ steps.version.outputs.version }}（${{ github.run_number }}）
          body: |
            version: ${{ steps.version.outputs.version }}
            commit: ${{ github.sha }}
            built_at: ${{ github.run_started_at }}
          files: "Vocawiki-create-tool (*).apk"
          make_latest: true
          fail_on_unmatched_files: true

  exe:
    # 顺手把桌面版也打出来挂到同一个 release 上（Windows 上跑 PyInstaller）。
    # 这一步失败也不影响 APK 那条更新通道：release 已经发出去了，只是没有 zip 而已。
    needs: build
    runs-on: windows-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build the exe
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python build.py ${{ needs.build.outputs.version }}

      - name: Attach it to the same release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: "Vocawiki-create-tool (*).zip"
          fail_on_unmatched_files: true
