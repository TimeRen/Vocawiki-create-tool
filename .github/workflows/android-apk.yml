name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      # 应用代码全都要算上：改了 utils/ 里的业务逻辑，APK 也得重编。
      - "mobile/**"
      - "utils/**"
      - "models/**"
      - "config/**"
      - "i18n/**"
      - "main.py"
      - "build.py"
      # 打包链路与要进发布包的东西：漏了它们，改了也不会重出 APK / exe
      - "build_pyinstaller.py"
      - "build_android.sh"
      - "compile_mo.py"
      - "requirements.txt"
      - "config_simple.yaml"
      - "assets/**"
      # 只改测试也跑一次 CI（测试要跑；产物是否重建由 `changes` job 判断）
      - "tests/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "APK version"
        required: false
        default: ""

permissions:
  contents: write        # 发布 release：设置页「检查更新」读的就是它

jobs:
  changes:
    # 只改了 `tests/` 时也跑 CI（测试照跑），但不必重出 APK / exe、也不必发版：
    # 拿 push 前后的 diff 判断有没有动到会进包的东西。
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      artifacts: ${{ steps.filter.outputs.artifacts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$before" ] \
             || [[ "$before" =~ ^0+$ ]]; then
            echo "artifacts=true" >> "$GITHUB_OUTPUT"       # 手动触发 / 新分支：照常出包
            exit 0
          fi
          if ! changed=$(git diff --name-only "$before" "${{ github.sha }}"); then
            echo "artifacts=true" >> "$GITHUB_OUTPUT"       # 算不出 diff 就保守重建
            exit 0
          fi
          echo "changed files:"; echo "$changed"
          if [ -z "$changed" ]; then
            echo "artifacts=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -qv '^tests/'; then
            echo "artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "artifacts=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    # 应用代码的单元测试（界面那两套要显示器，CI 里跳过）。
    # 失败的测试不应该再发版，所以 `build` 挂在它后面。
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the unit tests
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys

          skip = {"test_ui.py", "test_vocalist_ui.py"}
          modules = [
              ".".join(path.with_suffix("").parts)
              for path in sorted(pathlib.Path("tests").rglob("test_*.py"))
              if path.name not in skip
          ]
          print(f"{len(modules)} test modules")
          subprocess.run([sys.executable, "-m", "unittest", "-q", *modules], check=True)
          PY

  build:
    needs: [changes, test]
    # 只改了测试：测试已经跑过，产物不用重建（也就不会平白顶一个新版本号）
    if: needs.changes.outputs.artifacts == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Work out the version
        id: version
        # 版本号要能跟仓库里已有的正式版（`v1.0.0` … `v2.4.0`）接着往上排，否则
        # 「检查更新」会认为 2.4.0 更新而 1.x 的滚动构建更旧。取现存的最高版本，把
        # 补丁位换成工作流序号：`2.4.0` → 这次是 `2.4.28`（手动触发时可以自己指定）。
        run: |
          VERSION="${{ github.event.inputs.version || '' }}"
          if [ -z "$VERSION" ]; then
            TAGS=$(curl -sS "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                   | grep -o '"tag_name": *"[^"]*"' | sed 's/.*: *"//; s/"$//')
            BASE=$(printf '%s\n' $TAGS | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
                   | sed 's/^v//' | sort -V | tail -n1)
            BASE=${BASE:-0.0}
            VERSION="$(echo "$BASE" | cut -d. -f1,2).${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "这次构建的版本号：$VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential ccache cmake git libffi-dev \
            libncurses5-dev libncursesw5-dev libssl-dev libtool openjdk-17-jdk \
            pkg-config unzip zip zlib1g-dev
          sudo apt-get install -y --no-install-recommends libtinfo5 || true

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Cache Buildozer toolchain
        uses: actions/cache@v4
        with:
          # 不要缓存 mobile/.buildozer：里面有指向旧 Python/venv 的路径，
          # 换 runner 后恢复会破坏 p4a 的 pip 环境。SDK/NDK 缓存就够了。
          path: ~/.buildozer
          # 换 key 前缀，避免沿用早先含 mobile/.buildozer 的旧缓存。
          key: p4a-sdk-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec.in') }}
          restore-keys: |
            p4a-sdk-${{ runner.os }}-

      - name: Syntax check the sources
        run: |
          # p4a v2024.01.21 ships CPython 3.11; catch syntax that only newer
          # interpreters accept before spending 10 minutes in the NDK.
          python -m compileall -q mobile main.py config models utils i18n

      - name: Build debug APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          chmod +x build_android.sh
          ./build_android.sh "${{ steps.version.outputs.version }}" debug

      - name: Check the APK is signed with the repository key
        # 每次构建都必须用同一把钥匙：Gradle 在没有 ~/.android/debug.keystore 时会
        # **当场随机生成**一把，于是每次发行都是新签名，手机上的旧版装不上
        # （INSTALL_FAILED_UPDATE_INCOMPATIBLE，用户 2026-10-21 报）。
        # build_android.sh 会装上仓库里的那份钥匙，这里核对指纹，免得以后又被悄悄换掉。
        run: |
          APKSIGNER=$(ls "$HOME"/.buildozer/android/platform/android-sdk/build-tools/*/apksigner | head -n1)
          APK=$(find . -maxdepth 1 -name 'Vocawiki-create-tool (*).apk' | head -n1)
          SHA=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*SHA-1 digest: //p' | head -n1)
          echo "APK 签名证书 SHA-1：$SHA"
          EXPECTED=467a0eb6e9cb10fc5eae4c56bb66cb618331726c
          if [ "$SHA" != "$EXPECTED" ]; then
            echo "::error::APK 不是用 mobile/signing/vocawiki-debug.keystore 签的（实际 $SHA，应为 $EXPECTED）"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vocawiki-apk
          path: "Vocawiki-create-tool (*).apk"
          if-no-files-found: error

      - name: Publish the update release
        # 设置页「检查更新」读的就是这个 release（`/releases/latest` → 里头的 apk / zip）。
        # 只维护**一个**滚动 release（tag 固定 `latest`）：每次推送把里面的文件覆盖掉，
        # 不按推送建一堆 release（用户 2026-10-20 要求）。资产名也固定成 `…-latest`
        # 这样新旧文件同名替换，不会越积越多。
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
          BUILT_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          cp "Vocawiki-create-tool (${VERSION}).apk" Vocawiki-create-tool-latest.apk
          NOTES=$(printf 'version: %s\ncommit: %s\nbuilt_at: %s\n' \
                          "$VERSION" "$COMMIT" "$BUILT_AT")
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest Vocawiki-create-tool-latest.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit latest --repo "$GITHUB_REPOSITORY" \
              --title "最新构建（$VERSION）" --notes "$NOTES"
          else
            gh release create latest Vocawiki-create-tool-latest.apk \
              --repo "$GITHUB_REPOSITORY" --title "最新构建（$VERSION）" --notes "$NOTES" \
              --prerelease
          fi

  exe:
    # 顺手把桌面版也打出来挂到同一个 release 上（Windows 上跑 PyInstaller）。
    # 以前有 continue-on-error，exe 挂了 run 还是绿的、release 里却留着旧 zip；
    # 现在让它正常失败（APK 已经发出去了，只是这一版没有新 zip）。
    needs: build
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build the exe
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python build.py ${{ needs.build.outputs.version }}

      - name: Attach it to the same release
        # 还是那个 `latest` release，只是把 zip 换掉（同名覆盖）
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          Copy-Item "Vocawiki-create-tool ($env:VERSION).zip" Vocawiki-create-tool-latest.zip
          gh release upload latest Vocawiki-create-tool-latest.zip --repo $env:GITHUB_REPOSITORY --clobber

      - name: Verify the release carries this build
        # `gh release upload` 失败本身会让这一步红掉；这里再核一遍大小与 commit，
        # 免得「同名覆盖没生效 / 上传了一半」时 release 里还是旧 zip 而 run 却是绿的。
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
        run: |
          $local = (Get-Item "Vocawiki-create-tool-latest.zip").Length
          $info = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/latest" | ConvertFrom-Json
          $asset = $info.assets | Where-Object { $_.name -eq "Vocawiki-create-tool-latest.zip" }
          if (-not $asset) { throw "release 里没有 Vocawiki-create-tool-latest.zip" }
          if ([int64]$asset.size -ne [int64]$local) {
            throw "release 上的 zip 大小不对：remote=$($asset.size) local=$local"
          }
          if ($info.body -notmatch [regex]::Escape("commit: $env:COMMIT")) {
            throw "release 说明不是这次提交：`n$($info.body)"
          }
          Write-Host "release ok: zip $local bytes, commit $env:COMMIT"
