name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      # 应用代码全都要算上：改了 utils/ 里的业务逻辑，APK 也得重编。
      - "mobile/**"
      - "utils/**"
      - "models/**"
      - "config/**"
      - "i18n/**"
      - "main.py"
      - "build_android.sh"
      - "compile_mo.py"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "APK version"
        required: false
        default: "0.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential ccache cmake git libffi-dev \
            libncurses5-dev libncursesw5-dev libssl-dev libtool openjdk-17-jdk \
            pkg-config unzip zip zlib1g-dev
          sudo apt-get install -y --no-install-recommends libtinfo5 || true

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Cache Buildozer toolchain
        uses: actions/cache@v4
        with:
          # 不要缓存 mobile/.buildozer：里面有指向旧 Python/venv 的路径，
          # 换 runner 后恢复会破坏 p4a 的 pip 环境。SDK/NDK 缓存就够了。
          path: ~/.buildozer
          # 换 key 前缀，避免沿用早先含 mobile/.buildozer 的旧缓存。
          key: p4a-sdk-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec.in') }}
          restore-keys: |
            p4a-sdk-${{ runner.os }}-

      - name: Syntax check the sources
        run: |
          # p4a v2024.01.21 ships CPython 3.11; catch syntax that only newer
          # interpreters accept before spending 10 minutes in the NDK.
          python -m compileall -q mobile main.py config models utils i18n

      - name: Build debug APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          chmod +x build_android.sh
          VERSION="${{ github.event.inputs.version || '0.0.0' }}"
          ./build_android.sh "$VERSION" debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vocawiki-apk
          path: "Vocawiki-create-tool (*).apk"
          if-no-files-found: error
